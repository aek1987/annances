<div class="container-fluid min-vh-100 d-flex p-0">
  <!-- 🟦 Formulaire à gauche -->
  <div class="form-section d-flex justify-content-center align-items-center">
    <div class="register-card p-4 shadow-lg">
      <h2 class="text-center mb-4">Je crée mon compte</h2>
      <form (ngSubmit)="onSubmit()" #registerForm="ngForm" novalidate>
        <!-- Nom complet -->
        <div class="form-group mb-3">
          <label for="fullname">Nom complet <span class="text-danger">*</span></label>
          <input type="text" id="fullname" name="fullname" class="form-control" [(ngModel)]="user.username" required #fullname="ngModel" />
          <div *ngIf="fullname.invalid && fullname.touched" class="text-danger small">
            Nom complet obligatoire.
          </div>
        </div>

        <!-- Email -->
        <div class="form-group mb-3">
          <label for="email">Email <span class="text-danger">*</span></label>
          <input type="email" id="email" name="email" class="form-control" [(ngModel)]="user.email" required email #email="ngModel" />
          <div *ngIf="email.invalid && email.touched" class="text-danger small">
            <span *ngIf="email.errors?.['required']">Email obligatoire.</span>
            <span *ngIf="email.errors?.['email']">Format email invalide.</span>
          </div>
        </div>

        <!-- Mot de passe -->
        <div class="form-group mb-3">
          <label for="password">Mot de passe <span class="text-danger">*</span></label>
          <input type="password" id="password" name="password" class="form-control" [(ngModel)]="user.password" required minlength="6" #password="ngModel" />
          <div *ngIf="password.invalid && password.touched" class="text-danger small">
            <span *ngIf="password.errors?.['required']">Mot de passe obligatoire.</span>
            <span *ngIf="password.errors?.['minlength']">Minimum 6 caractères.</span>
          </div>
        </div>

        <!-- Téléphone -->
        <div class="form-group mb-3">
          <label for="phone">Numéro de téléphone</label>
          <input type="tel" id="phone" name="phone" class="form-control" [(ngModel)]="user.phone" />
        </div>

        <!-- Fonction -->
        <div class="form-group mb-4">
          <label for="fonction">Fonction ou rôle <span class="text-danger">*</span></label>
          <select id="fonction" name="fonction" class="form-control" [(ngModel)]="user.role" required #fonction="ngModel">
            <option value="" disabled selected>Choisissez une fonction</option>
            <option value="entreprise">Entreprise</option>
            <option value="candidat">Chercheur d'emploi</option>
          </select>
          <div *ngIf="fonction.invalid && fonction.touched" class="text-danger small">
            Fonction obligatoire.
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="!registerForm.valid">S'inscrire</button>
      </form>
    </div>
  </div>

 <!-- Slider animé -->
<div class="slider-section d-flex flex-column justify-content-center align-items-center text-white p-4">
  <h3 class="mb-12 text-center">Pourquoi nous choisir ?</h3>

  <div class="slider-wrapper">
    <div 
      class="slider-card" 
      *ngFor="let slide of slides; let i = index"
      [class.active]="i === currentSlide"
    >
      <h5>{{ slide.title }}</h5>
      <p>{{ slide.description }}</p>
    </div>
  </div>
</div>

</div>
