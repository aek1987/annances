<div class="favorites-container">
  <h2>Mes offres favorites</h2>
  <div class="favorites-grid">
    <div *ngFor="let job of favoriteJobs" class="favorite-card">
      <!-- 🔹 Header de la carte -->
      <div class="card-header">
        <button class="detail-btn" (click)="goToDetail(job.id)">
          👁️ Détail
        </button>
      </div>

      <div class="job-info">
        <h3>{{ job.poste }}</h3>
        <p>
          <strong>Entreprise:</strong>
          {{ entrepriseMap[job.entrepriseId] || "Chargement..." }}
        </p>

        <p><strong>Lieu:</strong> {{ job.localisation }}</p>
        <p>
          <strong>Date enregistrée:</strong>
          {{ job.datePublication | date : "longDate" }}
        </p>
      </div>

      <div class="job-actions">
        <button (click)="removeFavorite(job.id)" class="remove-btn">
          ❌ Retirer
        </button>

        <span class="favorite-indicator" *ngIf="isFavori(job.id) | async">
          ❤️ Favori
        </span>
      </div>
    </div>
  </div>
</div>
