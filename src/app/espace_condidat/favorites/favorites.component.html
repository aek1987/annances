<div class="favorites-container">
  <h2>Mes offres favorites</h2>

  <div *ngIf="favoriteJobs.length === 0">
    <p>Aucune offre favorite pour le moment.</p>
  </div>

  <div *ngFor="let job of favoriteJobs" class="favorite-card">
    <div class="job-info">
      <h3>{{ job.poste }}</h3>
      <p><strong>Entreprise:</strong> {{ job.entrepriseId }}</p>
      <p><strong>Lieu:</strong> {{ job.localisation }}</p>
      <p><strong>Date enregistrée:</strong> {{ job.datePublication| date:'longDate' }}</p>
    </div>

    <div class="job-actions">
      <button (click)="removeFavorite(job.id)" class="remove-btn">
        ❌ Supprimer
      </button>

      <!-- Si tu veux afficher un indicateur de favori -->
      <span class="favorite-indicator" *ngIf="isFavori(job.id) | async">
        ❤️ Favori
      </span>
    </div>
  </div>
</div>
