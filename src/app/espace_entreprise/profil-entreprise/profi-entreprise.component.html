<div class="entreprise-card" *ngIf="entreprise">
  <div class="entreprise-header">
    <img *ngIf="entreprise.logo" [src]="entreprise.logo" alt="Logo {{entreprise.username}}" class="logo" />
    <h2>{{ entreprise.username }}</h2>
    <button class="btn-edit" (click)="toggleEdit()">✏️ Éditer</button>
  </div>

  <!-- Vue classique -->
  <div class="entreprise-info" *ngIf="!editMode">
    <p><b>Email :</b> {{ entreprise.email }}</p>
    <p><b>Téléphone :</b> {{ entreprise.phone }}</p>
    <p><b>Secteur :</b> {{ entreprise.secteur }}</p>
    <p><b>Description :</b> {{ entreprise.description || 'Non renseignée' }}</p>
    <p><b>Site :</b> 
      <a *ngIf="entreprise.site" [href]="entreprise.site" target="_blank">{{ entreprise.site }}</a>
      <span *ngIf="!entreprise.site">Non renseigné</span>
    </p>
    <p><b>Status :</b> 
      <span [class.active]="entreprise.status === 'active'" 
            [class.inactive]="entreprise.status === 'desactive'">
        {{ entreprise.status }}
      </span>
    </p>
  </div>

  <!-- Mode édition -->
  <form *ngIf="editMode" (ngSubmit)="saveEntreprise()" class="edit-form">
    <div>
      <label>Nom :</label>
      <input [(ngModel)]="entreprise.username" name="username" required />
    </div>

    <div>
      <label>Email :</label>
      <input [(ngModel)]="entreprise.email" name="email" type="email" required />
    </div>

    <div>
      <label>Téléphone :</label>
      <input [(ngModel)]="entreprise.phone" name="phone" />
    </div>

    <div>
      <label>Secteur :</label>
      <input [(ngModel)]="entreprise.secteur" name="secteur" />
    </div>

    <div>
      <label>Description :</label>
      <textarea [(ngModel)]="entreprise.description" name="description"></textarea>
    </div>

    <div>
      <label>Site web :</label>
      <input [(ngModel)]="entreprise.site" name="site" type="url" />
    </div>

    <div>
      <label>Status :</label>
      <select [(ngModel)]="entreprise.status" name="status">
        <option value="active">Active</option>
        <option value="desactive">Désactivée</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-save">💾 Sauvegarder</button>
      <button type="button" class="btn-cancel" (click)="toggleEdit()">❌ Annuler</button>
    </div>
  </form>
</div>
