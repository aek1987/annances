<div class="gestion-offres-container">
  <h2 class="title"> Gestion des Offres</h2>

  <!-- 🔎 Section Recherche -->
  <div class="search-section">
    <input type="text" placeholder="Rechercher par titre, localisation..." [(ngModel)]="searchQuery" (input)="searchOffres()">
    <button (click)="searchOffres()" class="btn-search">🔍 Rechercher</button>
  </div>

  <div class="list-section card">
    <h3 class="section-title">📋 Liste des offres publiées</h3>
    
    <ul class="offres-list">
      <li *ngFor="let offre of filteredOffres" class="offre-card">
        <div class="offre-info">
          <strong class="offre-title">{{ offre.titre }}</strong>
          <span class="offre-location"> - {{ offre.localisation }}</span>
          <p class="offre-description">{{ offre.description }}</p>
          <small class="offre-date">📅 Publiée le {{ offre.datePublication | date:'dd/MM/yyyy' }}</small>
          <p class="offre-status">
            Statut: 
            <span [ngClass]="{
              'status-active': offre.status === 'accepte',
              'status-pending': offre.status === 'en cours',
              'status-refused': offre.status === 'refuse'
            }">{{ offre.status || 'En attente' }}</span>
          </p>
        </div>

        <div class="offre-actions">
          <button (click)="acceptOffre(offre)" class="btn-success">✅ Accepter</button>
          <button (click)="editOffre(offre)" class="btn-primary">✏️ Modifier</button>
          <button (click)="deleteOffre(offre.id)" class="btn-danger">❌ Supprimer</button>
        </div>
      </li>
    </ul>

    <p *ngIf="filteredOffres.length === 0" class="empty-message">⚠️ Aucune offre publiée pour le moment.</p>
  </div>
</div>
